services:
  kairos-mcp:
    build: .
    container_name: kairos-mcp
    ports:
      - "8080:8080"
    environment:
      DEFAULT_TIMEZONE: "America/New_York"
      LOG_LEVEL: "info"
      # Calendar sources and API tokens come from secret files (below), so
      # passwords never sit in this file or in `docker inspect`.
      CALDAV_SOURCES_FILE: /run/secrets/caldav_sources
      KAIROS_API_TOKENS_FILE: /run/secrets/kairos_api_tokens
      # Hostnames /mcp answers to; set this when the gateway is reachable by name.
      # KAIROS_ALLOWED_HOSTS: "cal.example.com"
      # OAuth for claude.ai custom connectors (see README, "Authentication"):
      # KAIROS_PUBLIC_URL: "https://cal.example.com"
      # KAIROS_OIDC_ISSUER: "https://auth.example.com/application/o/kairos/"
      # KAIROS_OIDC_ALLOWED_SUBJECTS: "your-user-id"
    secrets:
      - caldav_sources
      - kairos_api_tokens
    restart: unless-stopped
    networks:
      - homelab

secrets:
  # JSON array, same shape as CALDAV_SOURCES in the README.
  caldav_sources:
    file: ./secrets/caldav_sources.json
  # One or more tokens, comma-separated. Generate with: openssl rand -hex 32
  kairos_api_tokens:
    file: ./secrets/kairos_api_tokens.txt

networks:
  homelab:
    driver: bridge
